name: Publicar no GitHub Pages

# Publica novamente quando main muda; também permite disparo manual no GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Concede apenas as permissões necessárias para ler o código e publicar Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Instala dependências travadas, executa testes e gera os arquivos estáticos.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # Só publica o resultado de dist depois que o job build termina com sucesso.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
